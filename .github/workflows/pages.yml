name: Pages

# Publishes two things to https://monxley.github.io/shoal/ :
#
#   /         the project site (docs/, generated by docs/build.py)
#   /fdroid/  an F-Droid repository of the signed release APKs
#
# Deployed as an artifact rather than served from a branch, because the F-Droid
# repository contains the APKs themselves. Committing a 61 MB binary per release
# would grow the git history by that much forever, and git keeps every blob even
# after the file is deleted. Nothing binary is stored in the repository; the
# APKs are fetched from GitHub Releases at deploy time.
#
# SETTINGS: Settings -> Pages -> Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fdroid/**"
      - "deploy/fdroid-repo.sh"
      - ".github/workflows/pages.yml"
  # A new release means a new APK for the F-Droid repository.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment: an interrupted one can leave the
# site partly updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The committed HTML is what Pages serves; build.py is how it is written.
      # If the two disagree, someone edited the copy and forgot to regenerate,
      # and the site would silently serve the older text.
      - name: Check the committed site matches its source
        run: |
          python3 docs/build.py
          if ! git diff --quiet -- docs/; then
            echo "docs/ is out of date with docs/build.py. Run it and commit:" >&2
            git --no-pager diff --stat -- docs/ >&2
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          rm -f _site/build.py            # source, not content

      # The F-Droid half needs the release signing key: an unsigned index is
      # one no client will load. Without the secrets the site still deploys,
      # with the F-Droid section simply absent rather than broken.
      - name: Is there a signing key?
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key, so no F-Droid repository will be" \
                 "published. Set ANDROID_KEYSTORE_BASE64 and the other three" \
                 "secrets (deploy/make-release-key.sh prints them)."
          fi

      # NOT the apt package. Ubuntu ships fdroidserver 2.2.1, which pulls
      # androguard 3.x, which cannot parse a resources.arsc produced by a
      # current aapt2 -- it asserts a reserved byte is zero and aborts:
      #     androguard...ResParserError: res1 must be zero!
      # That is what failed run 35162442977 on a perfectly good APK. 2.4+
      # carries androguard 4.x, which reads it.
      - name: Install fdroidserver
        if: steps.key.outputs.have == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libmagic1
          python3 -m venv "$RUNNER_TEMP/fdroid"
          "$RUNNER_TEMP/fdroid/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/fdroid/bin/pip" install --quiet 'fdroidserver>=2.4'
          echo "$RUNNER_TEMP/fdroid/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fdroid/bin/fdroid" --version
          "$RUNNER_TEMP/fdroid/bin/python" -c \
            "import androguard; print('androguard', androguard.__version__)"

      # Only releases built by release.yml carry the release signature; the
      # script drops anything signed with a different key, which is what the
      # pre-v1.0.0 APKs are. Downloading a few lets the repository offer a
      # previous version if the newest one has to be pulled.
      - name: Fetch the published APKs
        if: steps.key.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 5 \
                       --json tagName --jq '.[].tagName'); do
            echo "fetching $tag"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" \
              -p '*.apk' -D apks --skip-existing || echo "  (no APK on $tag)"
          done
          ls -l apks || true
          [ -n "$(ls -A apks 2>/dev/null)" ] || echo "::warning::No release APKs found yet."

      - name: Build the F-Droid repository
        id: fdroid
        if: steps.key.outputs.have == 'true'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$(ls -A apks 2>/dev/null)" ]; then
            echo "no APKs to publish; skipping the F-Droid repository"
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shoal.jks"
          KEYSTORE="$RUNNER_TEMP/shoal.jks" \
            bash deploy/fdroid-repo.sh apks _site/fdroid
          rm -f "$RUNNER_TEMP/shoal.jks"

      - name: What is being published
        run: |
          echo "=============== site ==============="
          find _site -maxdepth 2 -type f | sort | head -40
          echo "=============== size ==============="
          du -sh _site
          if [ -d _site/fdroid/repo ]; then
            echo "=============== F-Droid repo ==============="
            ls -l _site/fdroid/repo
          else
            echo "no F-Droid repository in this deployment"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
    outputs:
      fdroid: ${{ steps.fdroid.outcome }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site is published by now either way. This exists so that an F-Droid
  # failure still turns the run red rather than passing unnoticed -- the first
  # attempt at this took the whole site down with it, which is the opposite
  # mistake.
  fdroid-status:
    needs: [build, deploy]
    if: always() && needs.build.outputs.fdroid == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The site deployed, but the F-Droid repository did not build." >&2
          echo "See the 'Build the F-Droid repository' step in the build job." >&2
          exit 1
