name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One run per branch. Pushing three commits in quick succession used to leave
# three full builds competing for runners, so the run for the newest commit --
# the only one anyone is waiting on -- finished last. Superseded runs are
# cancelled; a run on the default branch is not, since those are the ones whose
# results are worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. RFC/FIPS crypto vectors)
        run: cargo test --all

  app:
    name: Flutter app (codegen, analyze, build APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      # codegen turns the Rust API in app/rust into the Dart bindings under
      # app/lib/src/rust; cargo-ndk cross-compiles the engine for Android so the
      # native library is actually bundled in the APK.
      # Both are compiled from source, which took two to nine minutes of every
      # run for binaries that never change between runs. The key carries the
      # exact versions, so a bump installs fresh rather than reusing a stale
      # binary -- which is also why cargo-ndk is pinned now instead of floating.
      - name: Cache the codegen and cross-compile tools
        id: cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-ndk
          key: cargo-tools-${{ runner.os }}-frb-2.0.0-ndk-3.5.4
      - name: Install tooling
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.0.0 --locked
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Scaffold platforms + generate bindings
        working-directory: app
        run: |
          # Android only: this job builds an APK and has no reason to scaffold a
          # desktop platform. (It does not change which packages are compiled —
          # `record` imports its Linux backend unconditionally, which is why
          # app/pubspec.yaml has to pin record_platform_interface.)
          flutter create --platforms=android --project-name aegis .
          flutter pub get
          # codegen canonicalizes this path before creating it, so it has to
          # exist first (deploy/build-apk.sh does the same).
          mkdir -p lib/src/rust
          # `flutter create` drops a placeholder widget test that references a
          # `MyApp` this project does not have, and imports flutter_test, which
          # is not a dependency. It is scaffold noise, not a test we wrote, and
          # it is the only thing in the tree with hard analyzer errors.
          rm -f test/widget_test.dart
          # Everything that turns the generated project into Aegis: INTERNET and
          # the other permissions, the background service, launcher aliases,
          # FLAG_SECURE + FlutterFragmentActivity, minSdk, the launcher icon.
          # Shared with deploy/build-apk.sh. Without it CI produced an APK that
          # installed and then could not reach the network at all.
          bash ../deploy/prepare-android-project.sh
          flutter_rust_bridge_codegen generate
          # codegen writes rust/src/frb_generated.rs but does not declare it in
          # the crate root, so without this the glue is never compiled and the
          # library loads with "undefined symbol: frb_get_rust_content_hash".
          # Same fix the build scripts apply.
          if [ -f rust/src/frb_generated.rs ] && ! grep -qE '^\s*(pub\s+)?mod frb_generated;' rust/src/lib.rs; then
            printf '\nmod frb_generated;\n' >> rust/src/lib.rs
          fi
      # A fast pre-check that the Dart call sites still match the Rust bridge
      # API (names, named arguments, sync vs async). `flutter analyze` catches
      # this too, but only after codegen and a full toolchain install — this
      # runs in a second and names the mismatch directly.
      - name: Check the Dart/Rust bridge boundary
        working-directory: app
        run: python3 tool/check_bridge.py

      - name: Analyze (compiles the Dart + generated bindings)
        working-directory: app
        run: flutter analyze
      - name: Build the Rust engine for Android (arm64, arm, x86_64)
        working-directory: app/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
      # Sign the release build with a real key when the repository has one.
      #
      # `flutter create` points the release signingConfig at Android's DEBUG
      # key, which is a published, universally-known key: a build signed with it
      # proves nothing about who produced it, and anyone can install a modified
      # "update" straight over it. For a messenger that is not a detail. When
      # the four secrets below are set the build is signed properly; when they
      # are not, the step says so in the log rather than quietly shipping a
      # debug-signed APK that looks like a release.
      # Two things `flutter create` leaves the build unable to do, both of
      # which surface as AAR metadata failures rather than as anything to do
      # with this app's own code.
      - name: Prepare the generated Gradle build
        working-directory: app/android
        run: |
          python3 ../../deploy/enable-core-library-desugaring.py .
          python3 ../../deploy/align-plugin-compile-sdk.py .
      - name: Configure release signing
        id: signing
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/aegis-release.jks
            # Written, never echoed: the values are secrets and the log is public.
            {
              printf 'storeFile=aegis-release.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > key.properties
          fi
          python3 ../../deploy/apply-release-signing.py .
          # Say which of the two builds this is, so later steps -- and the
          # artifact's own name -- cannot misrepresent it.
          if [ -f key.properties ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      # Optimised, tree-shaken, no debug assertions or observatory.
      # --build-number sets versionCode. Every build carried versionCode 1 from
      # the pubspec, so no build was ever *newer* than the one on the phone --
      # with a stable key that is a reinstall at best and a refusal at worst.
      # Minutes since the epoch: monotonic, needs no git history (checkout is
      # shallow here), and identical in rule to deploy/build-apk.sh so builds
      # from the two paths stay ordered relative to each other.
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-number="$(( $(date -u +%s) / 60 ))"
      # Say in the log which key actually signed it, read back off the APK
      # rather than inferred from which secrets were set.
      # The artifact's name states what it actually is. Without a signing key
      # Gradle falls back to ~/.android/debug.keystore, which a fresh runner does
      # not have -- so it generates a NEW RANDOM ONE EVERY RUN, and no such build
      # can ever install over the previous one. Calling that "release" would be a
      # lie that costs someone an afternoon.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'aegis-release-apk' || 'aegis-apk-DEBUG-SIGNED-cannot-update-in-place' }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Last in the job on purpose: this is the evidence anyone debugging an
      # install failure needs, and the run log is most easily read from its end.
      - name: Inspect the finished APK
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$apk" ] || { echo "no APK was produced"; exit 0; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          find_tool() {
            [ -n "$sdk" ] && [ -d "$sdk/build-tools" ] &&
              find "$sdk/build-tools" -name "$1" 2>/dev/null | sort | tail -1
          }
          echo "=============== APK ==============="
          ls -l "$apk"
          aapt2=$(find_tool aapt2 || true)
          if [ -n "$aapt2" ]; then
            "$aapt2" dump badging "$apk" | grep -E \
              "^package:|^application-label:|^application-icon-640:|^sdkVersion:|^targetSdkVersion:|^native-code:|^launchable-activity:" || true
          else
            echo "aapt2 not found; cannot report the package name or label."
          fi
          echo "=============== signature ==============="
          signer=$(find_tool apksigner || true)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            debug_certs=$("$signer" verify --print-certs "$apk" | grep -c 'CN=Android Debug' || true)
            case "$debug_certs" in
              0) echo "-> signed with a real key: this build can be installed over the previous one." ;;
              *) echo "-> DEBUG KEY. A fresh CI runner generates a new one every run, so this" 
                 echo "   build cannot be installed over any other. Run deploy/make-release-key.sh" 
                 echo "   once and set the four repository secrets to fix this permanently." ;;
            esac
          else
            echo "apksigner not found; cannot report which key signed this APK."
          fi
          echo "========================================="
