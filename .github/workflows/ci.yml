name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. RFC/FIPS crypto vectors)
        run: cargo test --all

  app:
    name: Flutter app (codegen, analyze, build APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      # codegen turns the Rust API in app/rust into the Dart bindings under
      # app/lib/src/rust; cargo-ndk cross-compiles the engine for Android so the
      # native library is actually bundled in the APK.
      - name: Install tooling
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.0.0 --locked
          cargo install cargo-ndk
      - name: Scaffold platforms + generate bindings
        working-directory: app
        run: |
          # Android only: this job builds an APK and has no reason to scaffold a
          # desktop platform. (It does not change which packages are compiled —
          # `record` imports its Linux backend unconditionally, which is why
          # app/pubspec.yaml has to pin record_platform_interface.)
          flutter create --platforms=android --project-name aegis .
          flutter pub get
          # codegen canonicalizes this path before creating it, so it has to
          # exist first (deploy/build-apk.sh does the same).
          mkdir -p lib/src/rust
          # `flutter create` drops a placeholder widget test that references a
          # `MyApp` this project does not have, and imports flutter_test, which
          # is not a dependency. It is scaffold noise, not a test we wrote, and
          # it is the only thing in the tree with hard analyzer errors.
          rm -f test/widget_test.dart
          flutter_rust_bridge_codegen generate
          # codegen writes rust/src/frb_generated.rs but does not declare it in
          # the crate root, so without this the glue is never compiled and the
          # library loads with "undefined symbol: frb_get_rust_content_hash".
          # Same fix the build scripts apply.
          if [ -f rust/src/frb_generated.rs ] && ! grep -qE '^\s*(pub\s+)?mod frb_generated;' rust/src/lib.rs; then
            printf '\nmod frb_generated;\n' >> rust/src/lib.rs
          fi
      # A fast pre-check that the Dart call sites still match the Rust bridge
      # API (names, named arguments, sync vs async). `flutter analyze` catches
      # this too, but only after codegen and a full toolchain install — this
      # runs in a second and names the mismatch directly.
      - name: Check the Dart/Rust bridge boundary
        working-directory: app
        run: python3 tool/check_bridge.py

      - name: Analyze (compiles the Dart + generated bindings)
        working-directory: app
        run: flutter analyze
      - name: Build the Rust engine for Android (arm64, arm, x86_64)
        working-directory: app/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
      # Sign the release build with a real key when the repository has one.
      #
      # `flutter create` points the release signingConfig at Android's DEBUG
      # key, which is a published, universally-known key: a build signed with it
      # proves nothing about who produced it, and anyone can install a modified
      # "update" straight over it. For a messenger that is not a detail. When
      # the four secrets below are set the build is signed properly; when they
      # are not, the step says so in the log rather than quietly shipping a
      # debug-signed APK that looks like a release.
      - name: Configure release signing
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/aegis-release.jks
            # Written, never echoed: the values are secrets and the log is public.
            {
              printf 'storeFile=aegis-release.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > key.properties
          fi
          python3 ../../deploy/apply-release-signing.py .
      # Optimised, tree-shaken, no debug assertions or observatory.
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release
      # Say in the log which key actually signed it, read back off the APK
      # rather than inferred from which secrets were set.
      - name: Report the APK's signature
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" || true
          fi
          ls -l "$apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
