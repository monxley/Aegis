[workspace]
resolver = "2"
# app/rust is the flutter_rust_bridge crate (Flutter-side; depends on
# flutter_rust_bridge + generated code), built by the Flutter toolchain, not
# this workspace.
exclude = ["app/rust"]
members = [
    "crates/shoal-crypto",
    "crates/shoal-identity",
    "crates/shoal-session",
    "crates/shoal-mailbox",
    "crates/shoal-net",
    "crates/shoal-client",
    "crates/shoal-relay",
    "crates/shoal-relay-server",
    "crates/shoal-mix",
    "crates/shoal-api",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/monxley/Aegis"
