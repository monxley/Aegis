[package]
name = "rust_lib_shoal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# The Shoal engine (this repo's workspace). All crypto/protocol lives here.
shoal-api = { path = "../../crates/shoal-api" }
# The bridge. Version is pinned by `flutter_rust_bridge_codegen` at setup time.
flutter_rust_bridge = "=2.0.0"
